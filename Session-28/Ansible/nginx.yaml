---
- name: Install and Configure Nginx
  hosts: aws1
  become: true

  tasks:

    - name: Install nginx
      yum:
        name: nginx
        state: present

    - name: Copy index.html
      copy:
        src: index.html
        dest: /usr/share/nginx/html/index.html
        owner: root
        group: root
        mode: '0644'

    - name: Start and enable nginx
      systemd:
        name: nginx
        state: started
        enabled: true

    - name: Ensure nginx is running
      service:
        name: nginx
        state: started