<!DOCTYPE html>
<html>

<head>
    <title>Add User</title>
</head>

<body>

    <h1>Add User</h1>

    <form action="/add-user" method="POST">

        <label>Name:</label>
        <input type="text" name="name" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Designation:</label>
        <input type="text" name="designation" required>

        <br><br>

        <button type="submit">
            Add User
        </button>

    </form>

</body>

</html>
